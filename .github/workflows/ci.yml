name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: avx2
            name: Linux x86-64 (AVX2)
            cflags: "-O3 -march=native -flto=auto -fno-plt -fomit-frame-pointer -falign-functions=32 -falign-loops=32"
            simd_tag: "AVX2"
          - variant: swar
            name: Linux x86-64 (SWAR Portable)
            cflags: "-O3 -mno-avx2"
            simd_tag: "SWAR"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get gnulib submodule revision
        id: gnulib-rev
        run: |
          echo "sha=$(git ls-tree HEAD gnulib | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache gnulib submodule
        uses: actions/cache@v4
        with:
          path: |
            gnulib
            .git/modules/gnulib
          key: ${{ runner.os }}-gnulib-${{ steps.gnulib-rev.outputs.sha }}

      - name: Initialize gnulib submodule
        run: |
          git config submodule.gnulib.url https://github.com/coreutils/gnulib.git
          git submodule update --init --depth 1 gnulib || {
            git config submodule.gnulib.url https://git.savannah.gnu.org/git/gnulib
            git submodule update --init --depth 1 gnulib
          }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint build-essential gettext gperf \
            libpcre2-dev locales-all pkg-config texinfo wget xz-utils

      - name: Bootstrap
        run: GNULIB_SRCDIR=gnulib ./bootstrap --no-git --skip-po

      - name: Configure
        run: ./configure --disable-gcc-warnings CFLAGS="${{ matrix.cflags }}"

      - name: Build
        run: |
          make -j"$(nproc)"
          make -C src grep-hooks grep-shrunk -j"$(nproc)"

      - name: Verify binary & version string
        run: |
          ./src/grep --version
          ./src/grep --version | ./src/grep -F "Supercharged grep"
          ./src/grep --version | ./src/grep -F "${{ matrix.simd_tag }})"

      - name: Run test suite
        run: |
          make check -C tests -j"$(nproc)" || {
            cat tests/test-suite.log
            awk '{print "::error::" $0}' tests/test-suite.log
            exit 1
          }

      - name: Run 200-check edge-case conformance, tree traversal & multi-pattern fuzzing
        if: matrix.variant == 'avx2'
        run: |
          python3 benchmarks/run_benchmarks.py --conformance-only
          python3 benchmarks/tree_conformance.py \
            --baseline src/grep \
            --candidate src/grep \
            --work-dir /tmp/tc-ci \
            --quick \
            --threads 2,4,16
          python3 benchmarks/kwset_diff.py \
            --baseline src/grep \
            --candidate src/grep \
            --cases 300 \
            --threads 2,8

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: asan-ubsan
            name: Linux x86-64 (ASan + UBSan)
            cflags: "-U_FORTIFY_SOURCE -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
            ldflags: "-fsanitize=address,undefined"
          - variant: tsan
            name: Linux x86-64 (TSan)
            cflags: "-U_FORTIFY_SOURCE -g -O1 -fsanitize=thread -fno-omit-frame-pointer"
            ldflags: "-fsanitize=thread"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get gnulib submodule revision
        id: gnulib-rev
        run: |
          echo "sha=$(git ls-tree HEAD gnulib | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache gnulib submodule
        uses: actions/cache@v4
        with:
          path: |
            gnulib
            .git/modules/gnulib
          key: ${{ runner.os }}-gnulib-${{ steps.gnulib-rev.outputs.sha }}

      - name: Initialize gnulib submodule
        run: |
          git config submodule.gnulib.url https://github.com/coreutils/gnulib.git
          git submodule update --init --depth 1 gnulib || {
            git config submodule.gnulib.url https://git.savannah.gnu.org/git/gnulib
            git submodule update --init --depth 1 gnulib
          }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint build-essential gettext gperf \
            libpcre2-dev locales-all pkg-config texinfo wget xz-utils

      - name: Bootstrap
        run: GNULIB_SRCDIR=gnulib ./bootstrap --no-git --skip-po

      - name: Configure (${{ matrix.variant }})
        run: ./configure --disable-gcc-warnings CFLAGS="${{ matrix.cflags }}" LDFLAGS="${{ matrix.ldflags }}"

      - name: Build
        run: |
          make -j"$(nproc)"
          make -C src grep-hooks grep-shrunk -j"$(nproc)"

      - name: Run parallel test suite under sanitizer
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1:report_thread_leaks=1"
          # Sanitized grep is several times slower; a hang still times out.
          PL_TIMEOUT: "300"
          DELAY_USEC: "400"
        run: |
          make check -C tests -j"$(nproc)" \
            TESTS="parallel-tree-walk parallel-chunked-mmap parallel-stream-stdin parallel-kwset-ac parallel-pcre-must parallel-env-limits parallel-coverage-edge-cases parallel-boundary-cases parallel-multithread-cases parallel-stress-test parallel-cli-flags parallel-coverage-complete parallel-sched-fuzz parallel-shrunk-limits parallel-delay-sites parallel-early-exit parallel-io-faults" || {
            cat tests/test-suite.log
            awk '{print "::error::" $0}' tests/test-suite.log
            exit 1
          }

      - name: Run tree traversal & differential fuzzing under sanitizer
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        run: |
          python3 benchmarks/tree_conformance.py \
            --baseline src/grep \
            --candidate src/grep \
            --work-dir /tmp/tc-san \
            --quick \
            --wide-count 2000 \
            --threads 2,8 \
            --only many \
            --only adv-r \
            --only adv-R \
            --only comb \
            --only fifo \
            --only large-clean.txt \
            --only large-enc.txt \
            --only large-nul_mid.txt
          python3 benchmarks/kwset_diff.py \
            --baseline src/grep \
            --candidate src/grep \
            --cases 200 \
            --threads 2,8

  macos:
    name: macOS ARM64 (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get gnulib submodule revision
        id: gnulib-rev
        run: |
          echo "sha=$(git ls-tree HEAD gnulib | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache gnulib submodule
        uses: actions/cache@v4
        with:
          path: |
            gnulib
            .git/modules/gnulib
          key: ${{ runner.os }}-gnulib-${{ steps.gnulib-rev.outputs.sha }}

      - name: Initialize gnulib submodule
        run: |
          git config submodule.gnulib.url https://github.com/coreutils/gnulib.git
          git submodule update --init --depth 1 gnulib || {
            git config submodule.gnulib.url https://git.savannah.gnu.org/git/gnulib
            git submodule update --init --depth 1 gnulib
          }

      - name: Install Homebrew dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          for pkg in autoconf automake gettext gperf texinfo wget xz pcre2; do
            brew list --versions "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done
          if ! command -v pkg-config >/dev/null 2>&1; then
            brew install pkgconf || brew install pkg-config
          fi
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "ACLOCAL_PATH=$(brew --prefix)/share/aclocal" >> "$GITHUB_ENV"

      - name: Bootstrap
        run: GNULIB_SRCDIR=gnulib ./bootstrap --no-git --skip-po

      - name: Configure
        run: ./configure --disable-gcc-warnings CFLAGS="-O3"

      - name: Build
        run: |
          make -j"$(sysctl -n hw.ncpu)"
          make -C src grep-hooks grep-shrunk -j"$(sysctl -n hw.ncpu)"

      - name: Verify binary & version string
        run: |
          ./src/grep --version
          ./src/grep --version | ./src/grep -F "Supercharged grep"
          ./src/grep --version | ./src/grep -F "SWAR)"

      - name: Run parallel test suite
        run: |
          make check -C tests -j"$(sysctl -n hw.ncpu)" \
            TESTS="parallel-tree-walk parallel-chunked-mmap parallel-stream-stdin parallel-kwset-ac parallel-pcre-must parallel-env-limits parallel-coverage-edge-cases parallel-boundary-cases parallel-multithread-cases parallel-stress-test parallel-cli-flags parallel-coverage-complete parallel-sched-fuzz parallel-shrunk-limits parallel-delay-sites parallel-early-exit parallel-io-faults" || {
            cat tests/test-suite.log
            awk '{print "::error::" $0}' tests/test-suite.log
            exit 1
          }

      - name: Run multi-pattern differential conformance
        run: |
          python3 benchmarks/kwset_diff.py \
            --baseline src/grep \
            --candidate src/grep \
            --cases 200 \
            --threads 2,8
