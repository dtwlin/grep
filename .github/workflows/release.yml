name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64-avx2
            os: ubuntu-latest
            cflags: "-O3 -mavx2"
          - target: linux-x86_64-portable
            os: ubuntu-latest
            cflags: "-O3 -mno-avx2"
          - target: macos-arm64
            os: macos-latest
            cflags: "-O3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get gnulib submodule revision
        id: gnulib-rev
        run: |
          echo "sha=$(git ls-tree HEAD gnulib | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache gnulib submodule
        uses: actions/cache@v4
        with:
          path: |
            gnulib
            .git/modules/gnulib
          key: ${{ runner.os }}-gnulib-${{ steps.gnulib-rev.outputs.sha }}

      - name: Initialize gnulib submodule
        run: |
          git config submodule.gnulib.url https://github.com/coreutils/gnulib.git
          git submodule update --init --depth 1 gnulib || {
            git config submodule.gnulib.url https://git.savannah.gnu.org/git/gnulib
            git submodule update --init --depth 1 gnulib
          }

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint build-essential gettext gperf \
            libpcre2-dev pkg-config texinfo wget xz-utils

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          for pkg in autoconf automake gettext gperf texinfo wget xz pcre2; do
            brew list --versions "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done
          if ! command -v pkg-config >/dev/null 2>&1; then
            brew install pkgconf || brew install pkg-config
          fi
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "ACLOCAL_PATH=$(brew --prefix)/share/aclocal" >> "$GITHUB_ENV"

      - name: Bootstrap, configure & build
        run: |
          GNULIB_SRCDIR=gnulib ./bootstrap --no-git --skip-po
          ./configure --disable-gcc-warnings CFLAGS="${{ matrix.cflags }}" --prefix="/usr/local"
          ncpus=$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make -j"$ncpus"
          make check -C tests -j"$ncpus" \
            TESTS="parallel-tree-walk parallel-chunked-mmap parallel-stream-stdin parallel-kwset-ac parallel-pcre-must parallel-env-limits"

      - name: Package release archive
        run: |
          version="${GITHUB_REF_NAME:-$(git describe --tags --always)}"
          pkg_name="supercharged-grep-${version}-${{ matrix.target }}"
          stage_dir="$RUNNER_TEMP/$pkg_name"
          mkdir -p "$stage_dir/bin" "$stage_dir/share/man/man1"
          cp src/grep src/egrep src/fgrep "$stage_dir/bin/"
          cp doc/grep.1 "$stage_dir/share/man/man1/" 2>/dev/null || true
          cp README.md BENCHMARK_RESULTS.md COPYING AUTHORS "$stage_dir/"
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf "dist/${pkg_name}.tar.gz" "$pkg_name"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${pkg_name}.tar.gz" > "${pkg_name}.tar.gz.sha256"
          else
            shasum -a 256 "${pkg_name}.tar.gz" > "${pkg_name}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate combined SHA256SUMS
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
